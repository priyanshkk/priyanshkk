<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Priyanshu Kumar — building in public">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#39ff14" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.4"/></filter>
  </defs>

  <rect width="1200" height="320" fill="#080b10"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="180" cy="60" r="150" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="1080" cy="280" r="170" fill="#22d3ee" fill-opacity="0.10" filter="url(#blur)"/>

  <rect x="28" y="28" width="1144" height="264" rx="18" fill="url(#panel)" stroke="#242b39" stroke-width="2"/>
  <path d="M28 46a18 18 0 0 1 18-18h1108a18 18 0 0 1 18 18v22H28Z" fill="#151b26" stroke="#242b39" stroke-width="1"/>
  <circle cx="56" cy="57" r="6" fill="#ff5f57"/>
  <circle cx="78" cy="57" r="6" fill="#febc2e"/>
  <circle cx="100" cy="57" r="6" fill="#28c840"/>
  <text x="122" y="62" font-family="monospace" font-size="14" fill="#8b95a7">priyanshu@dev:~ — zsh</text>

  <text x="64" y="126" font-family="monospace" font-size="18" fill="#22d3ee">$ whoami</text>
  <text x="64" y="178" font-family="monospace" font-size="46" font-weight="700" fill="url(#accent)" filter="url(#soft)">Priyanshu Kumar</text>
  <text x="66" y="212" font-family="monospace" font-size="17" fill="#e7ecf3">B.Tech CSE graduate · open-source developer · building in public</text>
  <text x="66" y="244" font-family="monospace" font-size="15" fill="#8b95a7">privacy-first CLI tools · AI apps · clean developer workflows</text>

  <text x="64" y="274" font-family="monospace" font-size="15" fill="#39ff14">$ git status</text>
  <text x="184" y="274" font-family="monospace" font-size="15" fill="#8b95a7">On branch building · open to collaborations</text>

  <g transform="translate(880 100)" font-family="monospace" text-anchor="end">
    <text x="240" y="0" font-size="13" fill="#5d6879" letter-spacing="3">SHIPPING</text>
    <text x="240" y="54" font-size="34" font-weight="700" fill="#39ff14">10</text>
    <text x="240" y="78" font-size="13" fill="#8b95a7">public repositories</text>
    <text x="240" y="120" font-size="34" font-weight="700" fill="#22d3ee">06</text>
    <text x="240" y="144" font-size="13" fill="#8b95a7">featured builds</text>
  </g>

  <rect x="880" y="252" width="240" height="2" rx="1" fill="#242b39"/>
  <rect x="880" y="252" width="150" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="0;240;150;240" dur="6s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1120" cy="253" r="3" fill="#39ff14">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
