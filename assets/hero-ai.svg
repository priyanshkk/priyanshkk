<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Priyanshu Kumar — AI engineer and open-source developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="55%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffc6"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#7c9cff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c9cff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffc6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#00ffc6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1d2b45" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect x="86" y="238" width="0" height="26">
        <animate attributeName="width" values="0;660;660;0" keyTimes="0;0.42;0.82;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.5">
    <animate attributeName="opacity" values="0.28;0.55;0.28" dur="8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="980" cy="180" r="220" fill="url(#halo)">
    <animate attributeName="r" values="200;245;200" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- matrix rain -->
  <g font-family="monospace" font-size="14" fill="#00ffc6" opacity="0.22">
    <text x="30" y="-20">0100101<animateTransform attributeName="transform" type="translate" values="0 0;0 420" dur="9s" repeatCount="indefinite"/></text>
    <text x="290" y="-60">アイウエオ<animateTransform attributeName="transform" type="translate" values="0 0;0 460" dur="11s" repeatCount="indefinite"/></text>
    <text x="640" y="-40">1011010<animateTransform attributeName="transform" type="translate" values="0 0;0 440" dur="8s" repeatCount="indefinite"/></text>
    <text x="1120" y="-80">カキクケコ<animateTransform attributeName="transform" type="translate" values="0 0;0 480" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- terminal panel -->
  <rect x="52" y="44" width="1096" height="272" rx="16" fill="#070c18" fill-opacity="0.92" stroke="#243755" stroke-width="1.5"/>
  <rect x="52" y="44" width="1096" height="34" rx="16" fill="#0e1729"/>
  <rect x="52" y="66" width="1096" height="12" fill="#0e1729"/>
  <g>
    <circle cx="76" cy="61" r="6" fill="#ff5f57"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="98" cy="61" r="6" fill="#febc2e"/>
    <circle cx="120" cy="61" r="6" fill="#28c840"/>
    <text x="150" y="66" font-family="monospace" font-size="12" fill="#7b8aa6">priyanshu@dev:~/profile — zsh</text>
  </g>

  <!-- identity -->
  <text x="86" y="112" font-family="monospace" font-size="13" fill="#00ffc6" letter-spacing="3">&gt; SYSTEM ONLINE // DEVELOPER PROFILE v2.6 <tspan fill="#00ffc6"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>
  <text x="86" y="178" font-family="'Courier New',monospace" font-size="58" font-weight="bold" fill="url(#neon)" filter="url(#glow)" letter-spacing="-1">PRIYANSHU KUMAR</text>
  <text x="88" y="210" font-family="'Courier New',monospace" font-size="21" fill="#d5e2f7" letter-spacing="2">AI ENGINEER  ·  OPEN-SOURCE DEVELOPER  ·  INDIA</text>

  <g clip-path="url(#reveal)">
    <text x="86" y="252" font-family="monospace" font-size="17" fill="#00ffc6">$ python -c "build('privacy-first tools')"  # Python · TypeScript · FastAPI · Docker</text>
  </g>
  <text x="86" y="288" font-family="monospace" font-size="13" fill="#7f92b0">[ ONLINE ]  accepting collaborations  ·  shipping in public  ·  no trackers, no telemetry</text>

  <!-- neural net -->
  <g transform="translate(760,92)" stroke="#2a3e60" stroke-width="1.5" fill="none">
    <path d="M20 30 L130 10 M20 30 L130 70 M20 30 L130 130 M130 10 L250 50 M130 70 L250 50 M130 70 L250 110 M130 130 L250 110" opacity="0.85"/>
    <g fill="#00ffc6" stroke="none" filter="url(#glow)">
      <circle cx="20" cy="30" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="10" r="6" fill="#7c9cff"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="70" r="7"><animate attributeName="r" values="6;8;6" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="130" r="6" fill="#a855f7"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="50" r="6" fill="#7c9cff"><animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="250" cy="110" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#00ffc6" stroke="none" filter="url(#glow)">
      <circle r="3.5"><animateMotion path="M20 30 L130 10 L250 50" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle r="3.5" fill="#a855f7"><animateMotion path="M20 30 L130 130 L250 110" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#7c9cff"><animateMotion path="M20 30 L130 70 L250 50" dur="2.7s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- corner brackets -->
  <g stroke="#00ffc6" stroke-width="2" fill="none" opacity="0.7">
    <path d="M52 76 V52 H76"/><path d="M1124 52 H1148 V76"/>
    <path d="M52 284 V308 H76"/><path d="M1124 308 H1148 V284"/>
  </g>

  <!-- scanline -->
  <rect x="52" y="44" width="1096" height="2" fill="#00ffc6" opacity="0.35">
    <animate attributeName="y" values="48;312;48" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
