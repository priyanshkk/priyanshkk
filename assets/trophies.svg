<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="1000" height="170" role="img" aria-label="Achievement badges">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#101a24"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="170" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="168" rx="17" fill="none" stroke="#39ff14" stroke-opacity="0.35"/>
  <rect x="5" y="5" width="990" height="160" rx="14" fill="none" stroke="#22d3ee" stroke-opacity="0.12"/>

  <rect x="-320" y="0" width="220" height="170" fill="url(#sheen)">
    <animate attributeName="x" from="-320" to="1000" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="32" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.4" fill="#39ff14" filter="url(#glow)">
    ◆ ACHIEVEMENTS UNLOCKED ◆
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <g>
      <rect x="30" y="50" width="220" height="88" rx="12" fill="#0d1117" stroke="#39ff14" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(140 76)" fill="none" stroke="#39ff14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-9 -10H9V0A9 9 0 0 1 -9 0Z"/>
        <path d="M-9 -6H-15V-1H-9M9 -6H15V-1H9"/>
        <path d="M0 9V14M-7 14H7"/>
      </g>
      <text x="140" y="112" font-size="26" font-weight="800" fill="#39ff14">21</text>
      <text x="140" y="128" font-size="10" letter-spacing="1.4" fill="#8b949e">TESTS PASSING</text>
    </g>

    <g>
      <rect x="270" y="50" width="220" height="88" rx="12" fill="#0d1117" stroke="#22d3ee" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.9;0.25;0.9" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(380 76)" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 -12L11 -7V2C11 8 6 12 0 14C-6 12 -11 8 -11 2V-7Z"/>
        <path d="M-5 0L-1 4L6 -4"/>
      </g>
      <text x="380" y="112" font-size="26" font-weight="800" fill="#22d3ee">CI</text>
      <text x="380" y="128" font-size="10" letter-spacing="1.4" fill="#8b949e">GREEN BUILD</text>
    </g>

    <g>
      <rect x="510" y="50" width="220" height="88" rx="12" fill="#0d1117" stroke="#f0f6fc" stroke-opacity="0.22">
        <animate attributeName="stroke-opacity" values="0.2;0.75;0.2" dur="4s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(620 76)" fill="none" stroke="#f0f6fc" stroke-width="1.7" stroke-linecap="round">
        <circle r="11"/>
        <path d="M-11 0H11M0 -11C5 -6 5 6 0 11M0 -11C-5 -6 -5 6 0 11M-9 -6H9M-9 6H9"/>
      </g>
      <text x="620" y="112" font-size="26" font-weight="800" fill="#f0f6fc">LIVE</text>
      <text x="620" y="128" font-size="10" letter-spacing="1.4" fill="#8b949e">PAGES SITE</text>
    </g>

    <g>
      <rect x="750" y="50" width="220" height="88" rx="12" fill="#0d1117" stroke="#a371f7" stroke-opacity="0.3">
        <animate attributeName="stroke-opacity" values="0.8;0.25;0.8" dur="4.4s" repeatCount="indefinite"/>
      </rect>
      <g transform="translate(860 76)" fill="none" stroke="#a371f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-12" y="-10" width="24" height="20" rx="3"/>
        <path d="M-7 -3L-3 0L-7 3M1 4H7"/>
      </g>
      <text x="860" y="112" font-size="26" font-weight="800" fill="#a371f7">5s</text>
      <text x="860" y="128" font-size="10" letter-spacing="1.4" fill="#8b949e">OFFLINE DEMO</text>
    </g>
  </g>

  <g fill="#39ff14">
    <circle cx="90" cy="158" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="158" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="158" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="158" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
